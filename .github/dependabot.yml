version: 2

updates:
  # Actions are pinned to commit SHAs (see .github/workflows/*.yml). Version
  # updates still track them: Dependabot checks the action's reference — a
  # version number or commit identifier — and opens a PR bumping the SHA and
  # the trailing version comment.
  #
  # Note this is separate from Dependabot ALERTS, which only fire for actions
  # using semantic versioning and stay silent on SHA-pinned ones. These
  # scheduled PRs are how a SHA pin picks up upstream security patches.
  - package-ecosystem: "github-actions"
    # Must be "/" — Dependabot searches .github/workflows itself.
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "security"
