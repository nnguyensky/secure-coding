name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  security-audit:
    name: OWASP Secure Coding & Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run Secure Coding Sync Validation
        run: node hooks/sync.js

      - name: Run Security Pattern Tests
        run: node hooks/test.js

      - name: Run Dependency Vulnerability Audit
        run: node hooks/audit.js

      - name: Scan PR Changes for Security Smells
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD > pr_files.txt
          if [ -s pr_files.txt ]; then
            node hooks/scan.js --files $(cat pr_files.txt)
          else
            echo "No changed files to scan."
          fi

      # On push there is no diff base, so scan everything tracked. Without this
      # the SARIF upload below is empty and the code-scanning dashboard goes
      # blank on every push to a default branch.
      - name: Scan Repository on Push
        if: github.event_name == 'push'
        run: node hooks/scan.js --all

      - name: Generate SARIF Security Report
        if: always()
        run: node hooks/report.js --sarif > results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        if: always()
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: Generate CycloneDX AI-SBOM & VEX
        if: always()
        run: node hooks/sbom.js --format cyclonedx --ai --vex --out sbom.json

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cyclonedx-ai-sbom
          path: sbom.json
